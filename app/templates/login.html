{% extends "base.html" %}
{% block title %}登录 · pcc 控制台{% endblock %}
{% block auth_content %}
<div class="login-wrap">
  <div class="login-card">
    <div class="login-head">
      <span class="brand-mark"><span class="brand-mark-dot"></span></span>
      <div>
        <h1>pcc 控制台</h1>
        <div class="field-hint" style="margin-top:2px">输入管理员凭据以继续</div>
      </div>
    </div>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <form method="post" action="/admin/login">
      <div class="field">
        <label for="username">账号</label>
        <input id="username" name="username" placeholder="管理员账号" autocomplete="username" autofocus>
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" placeholder="管理员密码" autocomplete="current-password">
      </div>
      <button class="primary" type="submit">登录</button>
    </form>
  </div>
</div>
{% endblock %}
