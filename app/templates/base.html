<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}pcc 控制台{% endblock %}</title>
<style>
  :root {
    --bg-deep: #0f0f10;
    --bg: #141415;
    --surface: #19191b;
    --raised: #232325;
    --hover: #202023;
    --hairline: rgba(237, 237, 237, 0.08);
    --hairline-strong: rgba(237, 237, 237, 0.14);
    --fg: #ededed;
    --fg-2: #a1a1a6;
    --fg-3: #85858b;
    --accent: #f2b441;
    --accent-soft: rgba(242, 180, 65, 0.14);
    --ok: #4cc38a;
    --ok-soft: rgba(76, 195, 138, 0.12);
    --danger: #e5484d;
    --danger-soft: rgba(229, 72, 77, 0.12);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--fg);
    font: 400 14px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  /* App Shell */
  .shell {
    display: flex;
    min-height: 100vh;
  }

  .sidebar {
    width: 240px;
    flex-shrink: 0;
    background: var(--bg-deep);
    border-right: 1px solid var(--hairline);
    padding: 20px 12px;
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 12px 20px;
    margin-bottom: 8px;
    border-bottom: 1px solid var(--hairline);
    text-decoration: none;
    color: var(--fg);
  }

  .brand-mark {
    width: 24px;
    height: 24px;
    border-radius: 6px;
    background: var(--raised);
    border: 1px solid var(--hairline-strong);
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }

  .brand-mark-dot {
    width: 8px;
    height: 8px;
    border-radius: 2px;
    background: var(--accent);
    transform: rotate(45deg);
  }

  .brand-name {
    font-size: 16px;
    font-weight: 600;
    line-height: 1;
    letter-spacing: 0;
  }

  .brand-sub {
    font-size: 12px;
    color: var(--fg-3);
    margin-left: auto;
    font-family: var(--mono);
  }

  .nav-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .nav-label {
    font-size: 12px;
    color: var(--fg-3);
    padding: 16px 12px 8px;
  }

  .nav-group:first-of-type .nav-label {
    padding-top: 8px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    height: 36px;
    padding: 0 12px;
    border-radius: 8px;
    color: var(--fg-2);
    text-decoration: none;
    font-size: 14px;
    font-weight: 400;
    border: 1px solid transparent;
    transition: background-color 140ms var(--ease), color 140ms var(--ease), border-color 140ms var(--ease);
  }

  .nav-item svg {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    color: var(--fg-3);
    transition: color 140ms var(--ease);
  }

  .nav-item:hover {
    background: var(--hover);
    color: var(--fg);
  }

  .nav-item:hover svg {
    color: var(--fg-2);
  }

  .nav-item.on {
    background: var(--raised);
    color: var(--fg);
    font-weight: 500;
    border-color: var(--hairline);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }

  .nav-item.on svg {
    color: var(--accent);
  }

  .sidebar-foot {
    margin-top: auto;
    padding-top: 16px;
    border-top: 1px solid var(--hairline);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-left: 12px;
    padding-right: 4px;
  }

  .admin-id {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--fg-2);
    font-family: var(--mono);
  }

  .live-dot {
    width: 6px;
    height: 6px;
    border-radius: 999px;
    background: var(--ok);
  }

  .logout-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 32px;
    padding: 0 8px;
    border-radius: 6px;
    color: var(--fg-3);
    text-decoration: none;
    font-size: 13px;
    transition: color 140ms var(--ease), background-color 140ms var(--ease);
  }

  .logout-link:hover {
    color: var(--fg);
    background: var(--hover);
  }

  /* Main content */
  .main {
    flex: 1;
    min-width: 0;
    padding: 28px 32px 48px;
    max-width: 1440px;
  }

  .page-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 24px;
  }

  .page-head h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 500;
    line-height: 1.2;
    color: var(--fg);
  }

  .page-sub {
    margin: 6px 0 0;
    font-size: 13px;
    color: var(--fg-3);
  }

  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 32px 0 12px;
  }

  .section-head h2 {
    margin: 0;
    font-size: 14px;
    font-weight: 500;
    color: var(--fg-2);
  }

  .section-link {
    font-size: 13px;
    color: var(--fg-3);
    text-decoration: none;
    transition: color 140ms var(--ease);
  }

  .section-link:hover {
    color: var(--fg);
  }

  /* Stat cards */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 16px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 12px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    text-decoration: none;
    color: inherit;
    transition: border-color 140ms var(--ease), background-color 140ms var(--ease);
  }

  a.stat-card:hover {
    border-color: var(--hairline-strong);
    background: var(--hover);
  }

  .stat-label {
    font-size: 13px;
    color: var(--fg-2);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .stat-num {
    font-size: 32px;
    font-weight: 500;
    line-height: 1.05;
    font-variant-numeric: tabular-nums;
    color: var(--fg);
  }

  .stat-num.accent {
    color: var(--accent);
  }

  .stat-meta {
    font-size: 12px;
    color: var(--fg-3);
    font-variant-numeric: tabular-nums;
  }

  .meter {
    height: 4px;
    border-radius: 2px;
    background: var(--raised);
    overflow: hidden;
    margin-top: 4px;
  }

  .meter-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
  }

  /* Panels & Forms */
  .panel {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }

  .toolbar {
    display: flex;
    align-items: flex-end;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }

  .field-inline {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field-inline label,
  .field label {
    font-size: 12px;
    color: var(--fg-2);
    display: block;
  }

  .field {
    margin-bottom: 20px;
  }

  .field label {
    margin-bottom: 8px;
  }

  .field-hint {
    font-size: 12px;
    color: var(--fg-3);
    margin-top: 6px;
  }

  input, select, textarea {
    background: var(--bg-deep);
    color: var(--fg);
    border: 1px solid var(--hairline-strong);
    border-radius: 8px;
    padding: 0 12px;
    height: 36px;
    font: 400 14px/1 var(--sans);
    outline: none;
    transition: border-color 140ms var(--ease), background-color 140ms var(--ease);
  }

  input::placeholder,
  textarea::placeholder {
    color: var(--fg-3);
  }

  input:hover, select:hover, textarea:hover {
    border-color: rgba(237, 237, 237, 0.22);
  }

  input:focus-visible, select:focus-visible, textarea:focus-visible {
    border-color: var(--accent);
  }

  textarea {
    height: auto;
    width: 100%;
    padding: 12px;
    line-height: 1.5;
    resize: vertical;
  }

  button, .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 36px;
    padding: 0 16px;
    border-radius: 8px;
    border: 1px solid var(--hairline-strong);
    background: var(--raised);
    color: var(--fg);
    font: 500 13px/1 var(--sans);
    cursor: pointer;
    text-decoration: none;
    transition: background-color 140ms var(--ease), border-color 140ms var(--ease), color 140ms var(--ease), transform 120ms var(--ease);
  }

  button:hover, .btn:hover {
    background: #2b2b2e;
    border-color: rgba(237, 237, 237, 0.2);
  }

  button:active, .btn:active {
    transform: scale(0.98);
  }

  button:focus-visible, .btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  button.primary {
    background: var(--fg);
    color: #111112;
    border-color: transparent;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
  }

  button.primary:hover {
    background: #ffffff;
  }

  button.ghost {
    height: 28px;
    padding: 0 10px;
    border-radius: 6px;
    background: transparent;
    border-color: var(--hairline);
    color: var(--fg-2);
    font-size: 12px;
    font-weight: 400;
  }

  button.ghost:hover {
    background: var(--raised);
    color: var(--fg);
    border-color: var(--hairline-strong);
  }

  button.danger {
    color: var(--danger);
  }

  button.danger:hover {
    background: var(--danger-soft);
    border-color: rgba(229, 72, 77, 0.28);
    color: var(--danger);
  }

  /* Tables */
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 12px;
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-variant-numeric: tabular-nums;
  }

  th, td {
    text-align: left;
    padding: 12px 16px;
    border-bottom: 1px solid var(--hairline);
    font-size: 13px;
    vertical-align: middle;
  }

  th {
    color: var(--fg-3);
    font-weight: 500;
    font-size: 12px;
    background: rgba(255, 255, 255, 0.015);
    white-space: nowrap;
  }

  tbody tr {
    transition: background-color 120ms var(--ease);
  }

  tbody tr:hover {
    background: rgba(255, 255, 255, 0.025);
  }

  tbody tr:last-child td {
    border-bottom: none;
  }

  .num-col {
    text-align: right;
    font-family: var(--mono);
  }

  .actions-col {
    text-align: right;
    white-space: nowrap;
  }

  .actions-col form {
    display: inline-block;
    margin: 0 0 0 4px;
  }

  .mono {
    font-family: var(--mono);
    font-size: 12px;
  }

  .muted {
    color: var(--fg-3);
  }

  .secondary {
    color: var(--fg-2);
  }

  /* Signature: Copyable Code Chip */
  .code-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--fg);
    background: var(--bg-deep);
    border: 1px solid var(--hairline);
    border-radius: 6px;
    padding: 3px 8px;
    cursor: pointer;
    user-select: all;
    transition: border-color 140ms var(--ease), background-color 140ms var(--ease);
  }

  .code-chip:hover {
    border-color: var(--accent);
    background: var(--raised);
  }

  /* Status badges: quiet rectangular tags with dot */
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 12px;
    line-height: 18px;
    white-space: nowrap;
    border: 1px solid transparent;
  }

  .tag::before {
    content: "";
    width: 5px;
    height: 5px;
    border-radius: 999px;
    background: currentColor;
  }

  .t-ok, .t-unused {
    background: var(--ok-soft);
    color: var(--ok);
    border-color: rgba(76, 195, 138, 0.2);
  }

  .t-used {
    background: var(--raised);
    color: var(--fg-3);
    border-color: var(--hairline);
  }

  .t-revoked, .t-exp {
    background: var(--danger-soft);
    color: var(--danger);
    border-color: rgba(229, 72, 77, 0.2);
  }

  .t-warn {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: rgba(242, 180, 65, 0.22);
  }

  /* Notices & Empty & Pager */
  .notice {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--hairline-strong);
    border-left: 2px solid var(--accent);
    color: var(--fg);
    padding: 12px 16px;
    border-radius: 8px;
    margin-bottom: 16px;
    font-size: 13px;
  }

  .err {
    color: var(--danger);
    font-size: 13px;
    margin: 0 0 16px;
    padding: 10px 12px;
    background: var(--danger-soft);
    border: 1px solid rgba(229, 72, 77, 0.22);
    border-radius: 8px;
  }

  .empty {
    color: var(--fg-3);
    padding: 40px 16px;
    text-align: center;
    font-size: 13px;
  }

  .pager {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 16px;
    font-size: 13px;
    color: var(--fg-3);
    font-variant-numeric: tabular-nums;
  }

  .pager-links {
    display: flex;
    gap: 8px;
  }

  .pager a {
    display: inline-flex;
    align-items: center;
    height: 32px;
    padding: 0 12px;
    border-radius: 6px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    color: var(--fg-2);
    text-decoration: none;
    transition: background-color 140ms var(--ease), color 140ms var(--ease);
  }

  .pager a:hover {
    background: var(--raised);
    color: var(--fg);
  }

  /* Login page */
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .login-card {
    width: 100%;
    max-width: 360px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 16px;
    padding: 28px;
  }

  .login-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }

  .login-head h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 500;
  }

  .login-card input {
    width: 100%;
  }

  .login-card button {
    width: 100%;
    height: 40px;
    margin-top: 4px;
  }

  /* Copy toast */
  .copy-toast {
    position: fixed;
    right: 24px;
    bottom: 24px;
    background: var(--raised);
    color: var(--fg);
    border: 1px solid var(--hairline-strong);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
    transition: opacity 160ms var(--ease), transform 160ms var(--ease);
    z-index: 99;
  }

  .copy-toast.show {
    opacity: 1;
    transform: translateY(0);
  }

  /* Responsive */
  @media (max-width: 960px) {
    .stats-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }

  @media (max-width: 800px) {
    .shell {
      flex-direction: column;
    }
    .sidebar {
      width: 100%;
      height: auto;
      position: static;
      border-right: none;
      border-bottom: 1px solid var(--hairline);
      padding: 12px 16px;
    }
    .brand {
      padding: 4px 0 12px;
      margin-bottom: 8px;
    }
    .nav-label {
      display: none;
    }
    .nav-group {
      flex-direction: row;
      flex-wrap: wrap;
      gap: 4px;
    }
    .sidebar-foot {
      margin-top: 12px;
      padding-top: 12px;
    }
    .main {
      padding: 20px 16px 40px;
    }
  }
</style>
</head>
<body>
{% if admin_user %}
<div class="shell">
  <aside class="sidebar">
    <a class="brand" href="/admin">
      <span class="brand-mark"><span class="brand-mark-dot"></span></span>
      <span class="brand-name">pcc</span>
      <span class="brand-sub">admin</span>
    </a>

    <nav class="nav-group" aria-label="主导航">
      <div class="nav-label">运营</div>
      <a href="/admin" class="nav-item {{ 'on' if request.url.path in ['/admin','/admin/'] else '' }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        <span>概览</span>
      </a>
      <a href="/admin/keys" class="nav-item {{ 'on' if request.url.path.startswith('/admin/keys') else '' }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg>
        <span>兑换码</span>
      </a>
      <a href="/admin/users" class="nav-item {{ 'on' if request.url.path.startswith('/admin/users') else '' }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>用户</span>
      </a>
      <a href="/admin/devices" class="nav-item {{ 'on' if request.url.path.startswith('/admin/devices') else '' }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></svg>
        <span>设备</span>
      </a>
      <a href="/admin/feedbacks" class="nav-item {{ 'on' if request.url.path.startswith('/admin/feedbacks') else '' }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>反馈</span>
      </a>

      <div class="nav-label">配置</div>
      <a href="/admin/settings" class="nav-item {{ 'on' if request.url.path.startswith('/admin/settings') else '' }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>系统设置</span>
      </a>
    </nav>

    <div class="sidebar-foot">
      <span class="admin-id"><span class="live-dot"></span>{{ admin_user }}</span>
      <a class="logout-link" href="/admin/logout" title="退出登录">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>退出</span>
      </a>
    </div>
  </aside>

  <main class="main">
    {% block content %}{% endblock %}
  </main>
</div>
{% else %}
{% block auth_content %}{% endblock %}
{% endif %}

<div id="copy-toast" class="copy-toast" role="status" aria-live="polite"></div>
<script>
(function () {
  var toast = document.getElementById('copy-toast');
  var timer = null;
  function showToast(msg) {
    if (!toast) return;
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(timer);
    timer = setTimeout(function () { toast.classList.remove('show'); }, 1400);
  }
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-copy]');
    if (!el) return;
    var text = el.getAttribute('data-copy');
    if (!text) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        showToast('已复制 ' + text);
      }).catch(function () {});
    } else {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); showToast('已复制 ' + text); } catch (err) {}
      document.body.removeChild(ta);
    }
  });
})();
</script>
</body>
</html>
