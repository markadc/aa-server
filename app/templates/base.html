<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}pcc 管理后台{% endblock %}</title>
<style>
  :root { --bg:#0d0d0d; --card:#1a1a1a; --line:#2a2a2a; --fg:#e6e6e6; --dim:#8a8a8a; --amber:#ffb340; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  nav { display:flex; gap:18px; align-items:center; padding:14px 24px; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; }
  nav a { color:var(--dim); text-decoration:none; }
  nav a:hover, nav a.on { color:var(--amber); }
  nav .spacer { flex:1; }
  main { max-width:1180px; margin:0 auto; padding:24px; }
  h1 { font-size:20px; margin:0 0 18px; }
  h2 { font-size:15px; margin:24px 0 10px; color:var(--dim); font-weight:normal; }
  .cards { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; }
  .card .num { font-size:26px; font-weight:700; color:var(--amber); }
  .card .lab { color:var(--dim); font-size:12px; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  th, td { text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); font-size:13px; }
  th { color:var(--dim); font-weight:500; background:#141414; }
  tr:last-child td { border-bottom:none; }
  code, .mono { font-family:ui-monospace,Menlo,monospace; font-size:12px; }
  .tag { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; }
  .t-unused { background:#1f3d24; color:#7ee787; }
  .t-used { background:#33312a; color:var(--dim); }
  .t-revoked { background:#3d1f1f; color:#ff7b72; }
  .t-ok { background:#1f3d24; color:#7ee787; }
  .t-exp { background:#3d1f1f; color:#ff7b72; }
  form.inline { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
  input, select, textarea, button { background:#141414; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:7px 10px; font:inherit; }
  textarea { width:100%; resize:vertical; }
  button { cursor:pointer; }
  button.primary { background:var(--amber); color:#1a1a1a; border:none; font-weight:600; }
  button.ghost { background:transparent; }
  button.danger { color:#ff7b72; }
  .pager { display:flex; gap:8px; margin-top:12px; align-items:center; color:var(--dim); }
  .notice { background:#1f2d3d; border:1px solid #2d4a6b; color:#9ecbff; padding:10px 14px; border-radius:10px; margin-bottom:14px; }
  .err { color:#ff7b72; }
  .empty { color:var(--dim); padding:24px; text-align:center; }
  .login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .login { width:340px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:26px; }
  .login h1 { font-size:18px; }
  .login input { width:100%; margin-bottom:12px; }
  .login button { width:100%; }
  .field { margin-bottom:16px; }
  .field label { display:block; color:var(--dim); font-size:13px; margin-bottom:6px; }
  .field input { width:100%; max-width:420px; }
</style>
</head>
<body>
{% if admin_user %}
<nav>
  <a href="/admin" class="{{ 'on' if request.url.path in ['/admin','/admin/'] else '' }}">概览</a>
  <a href="/admin/keys" class="{{ 'on' if request.url.path.startswith('/admin/keys') else '' }}">兑换码</a>
  <a href="/admin/users" class="{{ 'on' if request.url.path.startswith('/admin/users') else '' }}">用户</a>
  <a href="/admin/devices" class="{{ 'on' if request.url.path.startswith('/admin/devices') else '' }}">设备</a>
  <a href="/admin/feedbacks" class="{{ 'on' if request.url.path.startswith('/admin/feedbacks') else '' }}">反馈</a>
  <a href="/admin/settings" class="{{ 'on' if request.url.path.startswith('/admin/settings') else '' }}">设置</a>
  <span class="spacer"></span>
  <span style="color:var(--dim)">{{ admin_user }}</span>
  <a href="/admin/logout">退出</a>
</nav>
{% endif %}
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
