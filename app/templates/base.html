<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}pcc 控制台{% endblock %}</title>
<script>
(function () {
  try {
    if (localStorage.getItem('pcc_admin_theme') === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  } catch (e) {}
})();
</script>
<style>
  :root {
    --bg-deep: #0f0f10;
    --bg: #141415;
    --surface: #19191b;
    --raised: #232325;
    --hover: #202023;
    --btn-hover: #2b2b2e;
    --btn-primary-bg: #ededed;
    --btn-primary-fg: #111112;
    --btn-primary-hover: #ffffff;
    --th-bg: rgba(255, 255, 255, 0.015);
    --tr-hover: rgba(255, 255, 255, 0.025);
    --card-shadow: none;
    --hairline: rgba(237, 237, 237, 0.08);
    --hairline-strong: rgba(237, 237, 237, 0.14);
    --fg: #ededed;
    --fg-2: #a1a1a6;
    --fg-3: #85858b;
    --accent: #f2b441;
    --accent-soft: rgba(242, 180, 65, 0.14);
    --ok: #4cc38a;
    --ok-soft: rgba(76, 195, 138, 0.12);
    --danger: #e5484d;
    --danger-soft: rgba(229, 72, 77, 0.12);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas, monospace;
  }

  [data-theme="light"] {
    --bg-deep: #f4f4f5;
    --bg: #fafafa;
    --surface: #ffffff;
    --raised: #f4f4f5;
    --hover: #ededef;
    --btn-hover: #e8e8eb;
    --btn-primary-bg: #171717;
    --btn-primary-fg: #ffffff;
    --btn-primary-hover: #2e2e32;
    --th-bg: #fafafa;
    --tr-hover: #f7f7f8;
    --card-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    --hairline: rgba(23, 23, 23, 0.08);
    --hairline-strong: rgba(23, 23, 23, 0.14);
    --fg: #171717;
    --fg-2: #525252;
    --fg-3: #737373;
    --accent: #b45309;
    --accent-soft: rgba(180, 83, 9, 0.1);
    --ok: #16a34a;
    --ok-soft: rgba(22, 163, 74, 0.1);
    --danger: #dc2626;
    --danger-soft: rgba(220, 38, 38, 0.1);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--fg);
    font: 400 14px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  /* App Shell */
  .shell {
    display: flex;
    min-height: 100vh;
  }

  .sidebar {
    width: 240px;
    flex-shrink: 0;
    background: var(--bg-deep);
    border-right: 1px solid var(--hairline);
    padding: 20px 12px;
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 12px 20px;
    margin-bottom: 8px;
    border-bottom: 1px solid var(--hairline);
    text-decoration: none;
    color: var(--fg);
  }

  .brand-mark {
    width: 24px;
    height: 24px;
    border-radius: 6px;
    background: var(--raised);
    border: 1px solid var(--hairline-strong);
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }

  .brand-mark-dot {
    width: 8px;
    height: 8px;
    border-radius: 2px;
    background: var(--accent);
    transform: rotate(45deg);
  }

  .brand-name {
    font-size: 16px;
    font-weight: 600;
    line-height: 1;
    letter-spacing: 0;
  }

  .brand-sub {
    font-size: 12px;
    color: var(--fg-3);
    margin-left: auto;
    font-family: var(--mono);
  }

  .nav-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .nav-label {
    font-size: 12px;
    color: var(--fg-3);
    padding: 16px 12px 8px;
  }

  .nav-group:first-of-type .nav-label {
    padding-top: 8px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    height: 36px;
    padding: 0 12px;
    border-radius: 8px;
    color: var(--fg-2);
    text-decoration: none;
    font-size: 14px;
    font-weight: 400;
    border: 1px solid transparent;
    transition: background-color 140ms var(--ease), color 140ms var(--ease), border-color 140ms var(--ease);
  }

  .nav-item svg {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    color: var(--fg-3);
    transition: color 140ms var(--ease);
  }

  .nav-item:hover {
    background: var(--hover);
    color: var(--fg);
  }

  .nav-item:hover svg {
    color: var(--fg-2);
  }

  .nav-item.on {
    background: var(--raised);
    color: var(--fg);
    font-weight: 500;
    border-color: var(--hairline);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }

  .nav-item.on svg {
    color: var(--accent);
  }

  .sidebar-foot {
    margin-top: auto;
    padding-top: 16px;
    border-top: 1px solid var(--hairline);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-left: 12px;
    padding-right: 4px;
  }

  .admin-id {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--fg-2);
    font-family: var(--mono);
  }

  .live-dot {
    width: 6px;
    height: 6px;
    border-radius: 999px;
    background: var(--ok);
  }

  .sidebar-actions {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .icon-btn {
    width: 32px;
    height: 32px;
    padding: 0;
    border-radius: 6px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--fg-3);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: color 140ms var(--ease), background-color 140ms var(--ease), border-color 140ms var(--ease);
  }

  .icon-btn:hover {
    color: var(--fg);
    background: var(--hover);
    border-color: var(--hairline);
  }

  .theme-icon-sun { display: none; }
  .theme-icon-moon { display: block; }
  [data-theme="light"] .theme-icon-sun { display: block; }
  [data-theme="light"] .theme-icon-moon { display: none; }

  .login-theme-btn {
    position: fixed;
    top: 20px;
    right: 20px;
  }

  .logout-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 32px;
    padding: 0 8px;
    border-radius: 6px;
    color: var(--fg-3);
    text-decoration: none;
    font-size: 13px;
    transition: color 140ms var(--ease), background-color 140ms var(--ease);
  }

  .logout-link:hover {
    color: var(--fg);
    background: var(--hover);
  }

  /* Main content */
  .main {
    flex: 1;
    min-width: 0;
    padding: 28px 32px 48px;
    max-width: 1440px;
  }

  .page-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 24px;
  }

  .page-head h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 500;
    line-height: 1.2;
    color: var(--fg);
  }

  .page-sub {
    margin: 6px 0 0;
    font-size: 13px;
    color: var(--fg-3);
  }

  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 32px 0 12px;
  }

  .section-head h2 {
    margin: 0;
    font-size: 14px;
    font-weight: 500;
    color: var(--fg-2);
  }

  .section-link {
    font-size: 13px;
    color: var(--fg-3);
    text-decoration: none;
    transition: color 140ms var(--ease);
  }

  .section-link:hover {
    color: var(--fg);
  }

  /* Stat cards */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 16px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 12px;
    padding: 20px;
    box-shadow: var(--card-shadow);
    display: flex;
    flex-direction: column;
    gap: 8px;
    text-decoration: none;
    color: inherit;
    transition: border-color 140ms var(--ease), background-color 140ms var(--ease);
  }

  a.stat-card:hover {
    border-color: var(--hairline-strong);
    background: var(--hover);
  }

  .stat-label {
    font-size: 13px;
    color: var(--fg-2);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .stat-num {
    font-size: 32px;
    font-weight: 500;
    line-height: 1.05;
    font-variant-numeric: tabular-nums;
    color: var(--fg);
  }

  .stat-num.accent {
    color: var(--accent);
  }

  .stat-meta {
    font-size: 12px;
    color: var(--fg-3);
    font-variant-numeric: tabular-nums;
  }

  .meter {
    height: 4px;
    border-radius: 2px;
    background: var(--raised);
    overflow: hidden;
    margin-top: 4px;
  }

  .meter-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
  }

  /* Panels & Forms */
  .panel {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: var(--card-shadow);
  }

  .toolbar {
    display: flex;
    align-items: flex-end;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }

  .field-inline {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field-inline label,
  .field label {
    font-size: 12px;
    color: var(--fg-2);
    display: block;
  }

  .field {
    margin-bottom: 20px;
  }

  .field label {
    margin-bottom: 8px;
  }

  .field-hint {
    font-size: 12px;
    color: var(--fg-3);
    margin-top: 6px;
  }

  input, select, textarea {
    background: var(--bg-deep);
    color: var(--fg);
    border: 1px solid var(--hairline-strong);
    border-radius: 8px;
    padding: 0 12px;
    height: 36px;
    font: 400 14px/1 var(--sans);
    outline: none;
    transition: border-color 140ms var(--ease), background-color 140ms var(--ease);
  }

  input::placeholder,
  textarea::placeholder {
    color: var(--fg-3);
  }

  input:hover, select:hover, textarea:hover {
    border-color: var(--fg-3);
  }

  input:focus-visible, select:focus-visible, textarea:focus-visible {
    border-color: var(--accent);
  }

  textarea {
    height: auto;
    width: 100%;
    padding: 12px;
    line-height: 1.5;
    resize: vertical;
  }

  button, .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 36px;
    padding: 0 16px;
    border-radius: 8px;
    border: 1px solid var(--hairline-strong);
    background: var(--raised);
    color: var(--fg);
    font: 500 13px/1 var(--sans);
    cursor: pointer;
    text-decoration: none;
    transition: background-color 140ms var(--ease), border-color 140ms var(--ease), color 140ms var(--ease), transform 120ms var(--ease);
  }

  button:hover, .btn:hover {
    background: var(--btn-hover);
    border-color: var(--hairline-strong);
  }

  button:active, .btn:active {
    transform: scale(0.98);
  }

  button:focus-visible, .btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  button.primary {
    background: var(--btn-primary-bg);
    color: var(--btn-primary-fg);
    border-color: transparent;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
  }

  button.primary:hover {
    background: var(--btn-primary-hover);
  }

  button.ghost {
    height: 28px;
    padding: 0 10px;
    border-radius: 6px;
    background: transparent;
    border-color: var(--hairline);
    color: var(--fg-2);
    font-size: 12px;
    font-weight: 400;
  }

  button.ghost:hover {
    background: var(--raised);
    color: var(--fg);
    border-color: var(--hairline-strong);
  }

  button.danger {
    color: var(--danger);
  }

  button.danger:hover {
    background: var(--danger-soft);
    border-color: rgba(229, 72, 77, 0.28);
    color: var(--danger);
  }

  /* Tables */
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 12px;
    overflow-x: auto;
    box-shadow: var(--card-shadow);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-variant-numeric: tabular-nums;
  }

  th, td {
    text-align: left;
    padding: 12px 16px;
    border-bottom: 1px solid var(--hairline);
    font-size: 13px;
    vertical-align: middle;
  }

  th {
    color: var(--fg-3);
    font-weight: 500;
    font-size: 12px;
    background: var(--th-bg);
    white-space: nowrap;
  }

  tbody tr {
    transition: background-color 120ms var(--ease);
  }

  tbody tr:hover {
    background: var(--tr-hover);
  }

  tbody tr:last-child td {
    border-bottom: none;
  }

  .num-col {
    text-align: right;
    font-family: var(--mono);
  }

  .actions-col {
    text-align: right;
    white-space: nowrap;
  }

  .actions-col form {
    display: inline-block;
    margin: 0 0 0 4px;
  }

  .mono {
    font-family: var(--mono);
    font-size: 12px;
  }

  .muted {
    color: var(--fg-3);
  }

  .secondary {
    color: var(--fg-2);
  }

  /* Signature: Copyable Code Chip */
  .code-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--fg);
    background: var(--bg-deep);
    border: 1px solid var(--hairline);
    border-radius: 6px;
    padding: 3px 8px;
    cursor: pointer;
    user-select: all;
    transition: border-color 140ms var(--ease), background-color 140ms var(--ease);
  }

  .code-chip:hover {
    border-color: var(--accent);
    background: var(--raised);
  }

  /* Status badges: quiet rectangular tags with dot */
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 12px;
    line-height: 18px;
    white-space: nowrap;
    border: 1px solid transparent;
  }

  .tag::before {
    content: "";
    width: 5px;
    height: 5px;
    border-radius: 999px;
    background: currentColor;
  }

  .t-ok, .t-unused {
    background: var(--ok-soft);
    color: var(--ok);
    border-color: rgba(76, 195, 138, 0.2);
  }

  .t-used {
    background: var(--raised);
    color: var(--fg-3);
    border-color: var(--hairline);
  }

  .t-revoked, .t-exp {
    background: var(--danger-soft);
    color: var(--danger);
    border-color: rgba(229, 72, 77, 0.2);
  }

  .t-warn {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: rgba(242, 180, 65, 0.22);
  }

  /* Notices & Empty & Pager */
  .notice {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--hairline-strong);
    border-left: 2px solid var(--accent);
    color: var(--fg);
    padding: 12px 16px;
    border-radius: 8px;
    margin-bottom: 16px;
    font-size: 13px;
  }

  .err {
    color: var(--danger);
    font-size: 13px;
    margin: 0 0 16px;
    padding: 10px 12px;
    background: var(--danger-soft);
    border: 1px solid rgba(229, 72, 77, 0.22);
    border-radius: 8px;
  }

  .empty {
    color: var(--fg-3);
    padding: 40px 16px;
    text-align: center;
    font-size: 13px;
  }

  .pager {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 16px;
    font-size: 13px;
    color: var(--fg-3);
    font-variant-numeric: tabular-nums;
  }

  .pager-links {
    display: flex;
    gap: 8px;
  }

  .pager a {
    display: inline-flex;
    align-items: center;
    height: 32px;
    padding: 0 12px;
    border-radius: 6px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    color: var(--fg-2);
    text-decoration: none;
    transition: background-color 140ms var(--ease), color 140ms var(--ease);
  }

  .pager a:hover {
    background: var(--raised);
    color: var(--fg);
  }

  /* Login page */
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .login-card {
    width: 100%;
    max-width: 360px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 16px;
    padding: 28px;
  }

  .login-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }

  .login-head h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 500;
  }

  .login-card input {
    width: 100%;
  }

  .login-card button {
    width: 100%;
    height: 40px;
    margin-top: 4px;
  }

  /* Custom Confirm Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.56);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 160ms var(--ease);
    z-index: 120;
  }

  [data-theme="light"] .modal-backdrop {
    background: rgba(15, 15, 16, 0.32);
  }

  .modal-backdrop.open {
    opacity: 1;
    pointer-events: auto;
  }

  .modal-dialog {
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border: 1px solid var(--hairline-strong);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.32);
    transform: translateY(8px) scale(0.98);
    transition: transform 180ms var(--ease);
  }

  [data-theme="light"] .modal-dialog {
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
  }

  .modal-backdrop.open .modal-dialog {
    transform: translateY(0) scale(1);
  }

  .modal-title {
    margin: 0 0 8px;
    font-size: 16px;
    font-weight: 500;
    color: var(--fg);
  }

  .modal-msg {
    margin: 0 0 24px;
    font-size: 13px;
    line-height: 1.6;
    color: var(--fg-2);
  }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  button.danger-solid {
    background: var(--danger);
    color: #ffffff;
    border-color: transparent;
  }

  button.danger-solid:hover {
    background: #cf3a3f;
    border-color: transparent;
    color: #ffffff;
  }

  /* Copy toast */
  .copy-toast {
    position: fixed;
    right: 24px;
    bottom: 24px;
    background: var(--raised);
    color: var(--fg);
    border: 1px solid var(--hairline-strong);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
    transition: opacity 160ms var(--ease), transform 160ms var(--ease);
    z-index: 99;
  }

  .copy-toast.show {
    opacity: 1;
    transform: translateY(0);
  }

  /* Feedback thread & reply quote */
  .table-top td {
    vertical-align: top;
  }

  .fb-content {
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.55;
    color: var(--fg);
  }

  .fb-reply-quote {
    margin-top: 8px;
    padding: 8px 12px;
    border-radius: 0 8px 8px 0;
    border-left: 2px solid var(--accent);
    background: var(--raised);
  }

  .fb-reply-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    margin-bottom: 2px;
  }

  .fb-reply-label {
    color: var(--accent);
    font-weight: 500;
  }

  .fb-reply-text {
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 13px;
    line-height: 1.5;
    color: var(--fg-2);
  }

  /* Settings modular cards */
  .settings-stack {
    display: flex;
    flex-direction: column;
    gap: 20px;
    max-width: 760px;
  }

  .section-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--hairline);
  }

  .section-title {
    margin: 0;
    font-size: 15px;
    font-weight: 500;
    color: var(--fg);
  }

  .section-desc {
    margin: 4px 0 0;
    font-size: 12px;
    color: var(--fg-3);
  }

  .safe-callout {
    padding: 10px 12px;
    border-radius: 8px;
    background: var(--raised);
    border: 1px solid var(--hairline);
    font-size: 12px;
    line-height: 1.6;
    color: var(--fg-2);
    margin-bottom: 16px;
  }

  .inline-control {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .fold-block {
    border: 1px solid var(--hairline);
    border-radius: 10px;
    background: var(--bg);
    padding: 12px 16px;
    margin-top: 16px;
  }

  .fold-block > summary {
    cursor: pointer;
    list-style: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-size: 13px;
    font-weight: 500;
    color: var(--fg-2);
    user-select: none;
  }

  .fold-block > summary::-webkit-details-marker {
    display: none;
  }

  .fold-block[open] > summary {
    color: var(--fg);
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--hairline);
  }

  .fold-chevron {
    font-size: 12px;
    color: var(--fg-3);
    transition: transform 160ms var(--ease);
  }

  .fold-block[open] .fold-chevron {
    transform: rotate(180deg);
  }

  .example-box {
    margin-top: 8px;
    padding: 10px 12px;
    border-radius: 8px;
    background: var(--raised);
    border: 1px solid var(--hairline);
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.5;
    color: var(--fg-2);
    white-space: pre-wrap;
  }

  .field-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
  }

  .field-status {
    font-size: 12px;
    color: var(--fg-3);
  }

  .field-status.ok {
    color: var(--ok);
  }

  .field-status.err {
    color: var(--danger);
  }

  .modal-quote {
    margin: 0 0 12px;
    padding: 10px 12px;
    border-radius: 8px;
    background: var(--raised);
    border: 1px solid var(--hairline);
    font-size: 13px;
    line-height: 1.5;
    color: var(--fg-2);
    max-height: 120px;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* Game catalog visual chips */
  .game-add-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .game-add-bar input {
    flex: 1;
    max-width: 360px;
  }

  .game-chip-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .game-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 8px 5px 12px;
    border-radius: 8px;
    background: var(--raised);
    border: 1px solid var(--hairline);
    font-size: 13px;
    color: var(--fg);
  }

  .game-chip.is-custom {
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .game-chip-badge {
    font-size: 11px;
    color: var(--accent);
    font-weight: 500;
  }

  .game-chip-del {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--fg-3);
    width: 20px;
    height: 20px;
    padding: 0;
    border-radius: 4px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    transition: background 120ms var(--ease), color 120ms var(--ease);
  }

  .game-chip-del:hover {
    background: var(--danger-soft);
    color: var(--danger);
  }

  .game-hidden-box {
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px dashed var(--hairline-strong);
  }

  .game-hidden-title {
    font-size: 12px;
    color: var(--fg-3);
    margin-bottom: 8px;
  }

  .game-chip-restore {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 8px;
    background: transparent;
    border: 1px dashed var(--hairline-strong);
    font-size: 12px;
    color: var(--fg-2);
    cursor: pointer;
    transition: border-color 120ms var(--ease), color 120ms var(--ease);
  }

  .game-chip-restore:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Responsive */
  @media (max-width: 960px) {
    .stats-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }

  @media (max-width: 800px) {
    .shell {
      flex-direction: column;
    }
    .sidebar {
      width: 100%;
      height: auto;
      position: static;
      border-right: none;
      border-bottom: 1px solid var(--hairline);
      padding: 12px 16px;
    }
    .brand {
      padding: 4px 0 12px;
      margin-bottom: 8px;
    }
    .nav-label {
      display: none;
    }
    .nav-group {
      flex-direction: row;
      flex-wrap: wrap;
      gap: 4px;
    }
    .sidebar-foot {
      margin-top: 12px;
      padding-top: 12px;
    }
    .main {
      padding: 20px 16px 40px;
    }
  }
</style>
</head>
<body>
{% if admin_user %}
<div class="shell">
  <aside class="sidebar">
    <a class="brand" href="/admin">
      <span class="brand-mark"><span class="brand-mark-dot"></span></span>
      <span class="brand-name">pcc</span>
      <span class="brand-sub">admin</span>
    </a>

    <nav class="nav-group" aria-label="主导航">
      <div class="nav-label">运营</div>
      <a href="/admin" class="nav-item {{ 'on' if request.url.path in ['/admin','/admin/'] else '' }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        <span>概览</span>
      </a>
      <a href="/admin/keys" class="nav-item {{ 'on' if request.url.path.startswith('/admin/keys') else '' }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg>
        <span>兑换码</span>
      </a>
      <a href="/admin/users" class="nav-item {{ 'on' if request.url.path.startswith('/admin/users') else '' }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>用户</span>
      </a>
      <a href="/admin/devices" class="nav-item {{ 'on' if request.url.path.startswith('/admin/devices') else '' }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></svg>
        <span>设备</span>
      </a>
      <a href="/admin/feedbacks" class="nav-item {{ 'on' if request.url.path.startswith('/admin/feedbacks') else '' }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>反馈</span>
      </a>
      <a href="/admin/crashes" class="nav-item {{ 'on' if request.url.path.startswith('/admin/crashes') else '' }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
        <span>崩溃日志</span>
      </a>

      <div class="nav-label">配置</div>
      <a href="/admin/settings" class="nav-item {{ 'on' if request.url.path.startswith('/admin/settings') else '' }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>系统设置</span>
      </a>
    </nav>

    <div class="sidebar-foot">
      <span class="admin-id"><span class="live-dot"></span>{{ admin_user }}</span>
      <div class="sidebar-actions">
        <button type="button" class="icon-btn" data-theme-toggle title="切换浅色 / 深色主题" aria-label="切换浅色或深色主题">
          <svg class="theme-icon-sun" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
          <svg class="theme-icon-moon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
        <a class="logout-link" href="/admin/logout" title="退出登录" data-confirm="退出后需要重新输入管理员账号和密码" data-confirm-title="退出管理后台" data-confirm-ok="退出">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span>退出</span>
        </a>
      </div>
    </div>
  </aside>

  <main class="main">
    {% block content %}{% endblock %}
  </main>
</div>
{% else %}
<button type="button" class="icon-btn login-theme-btn" data-theme-toggle title="切换浅色 / 深色主题" aria-label="切换浅色或深色主题">
  <svg class="theme-icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
  <svg class="theme-icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
</button>
{% block auth_content %}{% endblock %}
{% endif %}

<div id="confirm-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="confirm-title" aria-hidden="true">
  <div class="modal-dialog">
    <h3 id="confirm-title" class="modal-title">确认操作</h3>
    <p id="confirm-msg" class="modal-msg"></p>
    <div class="modal-actions">
      <button type="button" id="confirm-cancel">取消</button>
      <button type="button" id="confirm-ok" class="primary">确认</button>
    </div>
  </div>
</div>

<div id="copy-toast" class="copy-toast" role="status" aria-live="polite"></div>
<script>
(function () {
  var toast = document.getElementById('copy-toast');
  var timer = null;
  function showToast(msg) {
    if (!toast) return;
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(timer);
    timer = setTimeout(function () { toast.classList.remove('show'); }, 1400);
  }

  var modal = document.getElementById('confirm-modal');
  var mTitle = document.getElementById('confirm-title');
  var mMsg = document.getElementById('confirm-msg');
  var mCancel = document.getElementById('confirm-cancel');
  var mOk = document.getElementById('confirm-ok');
  var pendingAction = null;

  function openConfirm(opts, onConfirm) {
    mTitle.textContent = opts.title || '确认操作';
    mMsg.textContent = opts.msg || '';
    mOk.textContent = opts.okText || '确认';
    mOk.className = opts.danger ? 'danger-solid' : 'primary';
    pendingAction = onConfirm;
    modal.classList.add('open');
    modal.setAttribute('aria-hidden', 'false');
    mCancel.focus();
  }

  function closeConfirm() {
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden', 'true');
    pendingAction = null;
  }

  mCancel.addEventListener('click', closeConfirm);
  mOk.addEventListener('click', function () {
    var fn = pendingAction;
    closeConfirm();
    if (fn) fn();
  });
  modal.addEventListener('click', function (e) {
    if (e.target === modal) closeConfirm();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && modal.classList.contains('open')) {
      closeConfirm();
    }
  });

  document.addEventListener('click', function (e) {
    var confirmEl = e.target.closest('[data-confirm]');
    if (confirmEl) {
      e.preventDefault();
      var opts = {
        title: confirmEl.getAttribute('data-confirm-title') || '确认操作',
        msg: confirmEl.getAttribute('data-confirm'),
        okText: confirmEl.getAttribute('data-confirm-ok') || '确认',
        danger: confirmEl.getAttribute('data-confirm-danger') === '1'
      };
      if (confirmEl.tagName === 'A' && confirmEl.href) {
        var href = confirmEl.href;
        openConfirm(opts, function () { window.location.href = href; });
      } else {
        var form = confirmEl.closest('form');
        if (form) {
          openConfirm(opts, function () { form.submit(); });
        }
      }
      return;
    }

    var toggle = e.target.closest('[data-theme-toggle]');
    if (toggle) {
      var root = document.documentElement;
      var isLight = root.getAttribute('data-theme') === 'light';
      if (isLight) {
        root.removeAttribute('data-theme');
        try { localStorage.setItem('pcc_admin_theme', 'dark'); } catch (err) {}
      } else {
        root.setAttribute('data-theme', 'light');
        try { localStorage.setItem('pcc_admin_theme', 'light'); } catch (err) {}
      }
      return;
    }
    var el = e.target.closest('[data-copy]');
    if (!el) return;
    var text = el.getAttribute('data-copy');
    if (!text) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        showToast('已复制 ' + text);
      }).catch(function () {});
    } else {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); showToast('已复制 ' + text); } catch (err) {}
      document.body.removeChild(ta);
    }
  });
})();
</script>
</body>
</html>
