# ============================================================
# pcc 服务端配置（部署用）
#
# 约定：本仓库只在服务器上跑，用的就是服务器本机的 PostgreSQL。
# 所以这个文件里的连接信息是真实可用值：在服务器上
#   cp config.example.toml config.toml
# 之后无需改任何一行，直接启动即可。
# config.toml 本身被 .gitignore 排除，永不提交。
# ============================================================

[server]
# 监听地址：0.0.0.0 = 允许外部访问；只本机调试可用 127.0.0.1
host = "0.0.0.0"
port = 8800
# 对外访问地址（后台页面、APK 里填的接口地址都用它）
public_url = "http://1.15.42.244:8800"
# 仅当整站跑在 HTTPS 反代后面才设 true；纯 HTTP 部署必须 false，否则登录 cookie 被浏览器丢弃（303 循环）
session_secure = false
# 公网部署默认关掉 /docs，避免把接口结构全暴露；本地调试要开就改成 true
docs_enabled = false

[database]
host = "127.0.0.1"
port = 5432
dbname = "aa_data"
user = "user1"
password = "wauo.23-=u1"

[auth]
# 管理后台登录账号
admin_user = "admin"
# 后台登录密码的哈希（不要填明文）。生成方式：
#   cd server && python3 -m app.security hash '你的密码'
admin_password_hash = "pbkdf2_sha256$200000$4f9fc40c794db4e335de82d9485769d6$486b801689b0ba8cf36304365f8fa873644e984a519fbfdfa8e534345b5461b5"
# 会话签名密钥，随便改成一串随机字符
secret_key = "e338e9e3ba7ab89e266a46eb711890e137d4c6404a6d10e05d0f5f8dcc363777"

# --- 快速登录（APK「我的」页一键注册登录）---
# 同一设备两次成功注册的最小间隔（秒）
quick_login_interval_seconds = 60
# 同一设备每小时最多成功注册次数
quick_login_hourly_max = 20
# 同一来源 IP 两次成功注册的最小间隔（秒）与每小时上限
# install_id 是客户端自报的，换一个就能绕过设备限流，这层是兑底
quick_login_ip_interval_seconds = 10
quick_login_ip_hourly_max = 30
# 登录校验结果的本地宽限天数：期间断网/服务器不可达仍可记牌
login_grace_days = 7

[license]
# 服务器不可达时，App 本地缓存授权的宽限天数
grace_days = 7
# 生成兑换码时没填天数就用这个
default_days = 365

[app]
name = "pcc"
timezone = "Asia/Shanghai"
# 客服 QQ：就发这个号，APK 的空值兜底也是它，两处保持一致
kefu_qq = "123456789"
